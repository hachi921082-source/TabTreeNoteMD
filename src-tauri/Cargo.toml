[package]
name = "tabtreenotemd"
version = "1.0.0"
description = "TabTreeNoteMD: a tab x tree personal note editor"
authors = ["TabTreeNoteMD"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Tauri app shell (project-architecture/PLAN.md §1). `tray-icon` is needed for
# window-operation/PLAN.md §4's auto-launch-to-tray feature.
tauri = { version = "2.11.5", features = ["tray-icon"] }
# IPC / persisted-JSON serialization (project-architecture/PLAN.md §1, §3)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Folder watching for external-change detection (persistence-fs/PLAN.md §5).
# The debouncer coalesces the multiple raw OS notifications a single logical
# write can generate (observed in practice on Windows/NTFS: one `fs::write`
# call already produces >1 raw ReadDirectoryChangesW event for the same
# path) into one logical event per quiet period, matching chokidar's
# built-in debouncing behavior that the legacy app relied on.
notify = "8.2.0"
notify-debouncer-full = "0.6.0"
# Content hash for watcher composite conflict classification (persistence-fs/PLAN.md §5)
sha2 = "0.11.0"
# OS trash for memo delete (persistence-fs/PLAN.md §9)
trash = "5.2.6"
# Internal-only diagnostic logging (spec.md §5.10)
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# Async runtime, required by Tauri and by tab-lock's async scrypt (detailed-spec.md §3.4)
tokio = { version = "1.53.1", features = ["full"] }
# Random token/IV/salt generation (tab-lock, image-handling)
rand = "0.10.2"
# Tab lock encryption (tab-lock/PLAN.md, detailed-spec.md §3.4)
aes-gcm = "0.11.0"
scrypt = "0.12.0"
# Base64 encoding for tab-lock's on-disk JSON fields (saltB64/ivB64/tagB64/ciphertextB64,
# tab-lock/PLAN.md §2)
base64 = "0.22.1"
# Shift_JIS fallback decoding for memo bodies (editor-save/PLAN.md)
encoding_rs = "0.8.35"
# OS folder-selection dialog for tab create/register-existing (spec.md §2.1,
# "never window.prompt()"; tab-management/PLAN.md §2)
tauri-plugin-dialog = "2.7.2"
# OS "reveal in file manager" for tab_open_location, via the OS-standard
# Shell API rather than shell string concatenation (spec.md §2.8, §2.1;
# tab-management/PLAN.md §2)
tauri-plugin-opener = "2.5.4"
# Second-launch detection: brings the already-running instance's window to the foreground and
# exits the new process immediately, rather than opening a second window or racing two processes
# on settings.json (window-operation/PLAN.md §5).
tauri-plugin-single-instance = "2.4.3"
# Auto-launch-to-tray-on-Windows-login setting (window-operation/PLAN.md §4). Registers a
# `HKCU\...\Run` registry entry pointing at the exe with a `--tray` argument; no
# Startup-folder-shortcut Tauri plugin was found, so this registry Run-key approach is used as the
# plan's own pre-approved fallback (detailed-spec.md §5.7) rather than hand-rolling the registry
# write. See commands/autostart.rs for the wrapper and settings.json handling.
tauri-plugin-autostart = "2.5.1"
# Cross-tab full-text search's optional `regex: true` query mode (search-index/PLAN.md §4) — the
# exact `SearchOptions` set is implementation discretion, and this well-established crate is a
# lighter lift than hand-rolling a regex engine for a mirrored-from-in-memo-search option.
regex = "1.11.3"
# Pasted-image format sniffing (magic-number detection) and dimension decoding
# (image-handling/PLAN.md §3). Only the format families spec.md §4.2/detailed-spec.md §3.6 call
# out (png/jpg/gif/webp) plus bmp (a common raw-clipboard-bitmap-adjacent format on Windows) are
# enabled, rather than the crate's full default feature set, to keep the dependency footprint
# proportional to what this one command actually needs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
# `tauri::test::mock_app`/`MockRuntime` — used by `watch/watcher_registry.rs`'s lifecycle tests,
# which need a real (test-only) `AppHandle` now that `WatcherRegistry::start` emits events
# (GitHub issue #211). No effect on release builds; `[dependencies]`'s own plain `tauri` entry
# (without this feature) is what's actually shipped.
tauri = { version = "2.11.5", features = ["test"] }
